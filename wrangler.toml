name = "docker-hub-worker-proxy"
main = "src/index.js"
compatibility_date = "2026-10-31"

# Users attach their own Custom Domain in the Cloudflare Dashboard.
# No personal domain, account ID, zone ID, or secret is required in this file.
workers_dev = false

# Alternatively, configure a Custom Domain here instead of managing it
# in the Dashboard. Replace the placeholder with a hostname in your Zone.
# [[routes]]
# pattern = "YOUR_SUBDOMAIN.YOUR_DOMAIN"
# custom_domain = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
